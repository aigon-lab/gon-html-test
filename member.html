<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>会員専用ルーム｜AIGON.LAB 実践メンバーシップ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #060913;
      color: #f8fafc;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      line-height: 1.7;
    }
    .header {
      background: rgba(6, 9, 19, 0.96);
      border-bottom: 1px solid rgba(212, 175, 55, 0.4);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      font-weight: 900;
      color: #f3d28b;
      letter-spacing: 0.08em;
      text-decoration: none;
      font-size: 1.05rem;
    }
    .back-link {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 6px 14px;
      border-radius: 6px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 20px 64px 20px;
    }
    .lock-panel {
      max-width: 480px;
      margin: 60px auto;
      background: #0f172a;
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 14px;
      padding: 30px 24px;
      text-align: center;
    }
    .lock-panel input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #8c6d2e;
      font-size: 1rem;
      margin: 14px 0;
    }
    .gold-btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #f3d06b, #c89d28);
      color: #090d16;
      font-weight: 900;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .fcl-banner {
      background: linear-gradient(135deg, rgba(29, 78, 216, 0.25), rgba(212, 175, 55, 0.15));
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 32px;
    }
    .sec-title {
      font-size: 1.2rem;
      color: #f3d28b;
      border-left: 4px solid #d4af37;
      padding-left: 12px;
      margin: 32px 0 16px 0;
    }
    /* ▼ 横3〜4列で自動増殖するグリッド ▼ */
    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }
    .prompt-card {
      background: #0f172a;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .prompt-card h3 {
      font-size: 1rem;
      color: #ffffff;
      margin: 0 0 10px 0;
    }
    .prompt-body {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 10px;
      font-size: 0.82rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .copy-btn {
      width: 100%;
      padding: 10px;
      background: rgba(212, 175, 55, 0.16);
      border: 1px solid #d4af37;
      color: #f3d28b;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .copy-btn.done {
      background: #16a34a;
      border-color: #16a34a;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="brand">AIGON.LAB｜会員専用ルーム</a>
    <a href="index.html" class="back-link">← トップページへ戻る</a>
  </header>

  <div class="container">
    <!-- 入室ロック画面 -->
    <div id="lock-screen" class="lock-panel">
      <div style="font-size:0.8rem; color:#f3d28b; font-weight:bold;">MEMBERS ONLY</div>
      <h1 style="font-size:1.35rem; margin:8px 0;">会員専用ルーム 入室認証</h1>
      <p style="font-size:0.88rem; color:#cbd5e1;">ご登録時にお送りした「合言葉」を入力してください。</p>
      <input type="password" id="member-pass" placeholder="合言葉を入力（例：aigon2026）">
      <button type="button" id="enter-btn" class="gold-btn" style="width:100%;">入室する</button>
      <p id="err-txt" style="color:#f87171; font-size:0.85rem; margin-top:10px; display:none;">合言葉が一致しません。</p>
    </div>

    <!-- 認証後コンテンツ -->
    <div id="member-content" style="display:none;">
      <div class="fcl-banner">
        <div>
          <div style="font-weight:bold; font-size:1.08rem; color:#ffffff;">💬 フェローチャットリンク（FCL）＆ 個別相談窓口</div>
          <div style="font-size:0.88rem; color:#cbd5e1;">サイトの修正依頼・AI活用のご相談はこちらから直接ご連絡ください（ご相談は予約制で承ります）。</div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <a href="https://toretamoo.com/apps/" target="_blank" rel="noopener noreferrer" class="gold-btn">🧰 AI業務ツール倉庫を開く</a>
          <a href="index.html#contact" class="back-link" style="background:#1e293b;">個別相談を予約する</a>
        </div>
      </div>

      <h2 class="sec-title">📋 現場即戦力・AIプロンプト集（ワンクリックコピー）</h2>
      <div id="dynamic-prompt-grid" class="prompt-grid">
        <p style="color:#cbd5e1;">プロンプトを読み込み中...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcGs-cwFjSO2B5UOJAwUCKu_varuBcJo0",
      authDomain: "aigon-lab.firebaseapp.com",
      projectId: "aigon-lab",
      storageBucket: "aigon-lab.firebasestorage.app",
      messagingSenderId: "783745519408",
      appId: "1:783745519408:web:283454bf6a50398b5fc2f5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PASS = "aigon2026";
    const lockScreen = document.getElementById("lock-screen");
    const memberContent = document.getElementById("member-content");

    function unlock() {
      lockScreen.style.display = "none";
      memberContent.style.display = "block";
      loadPrompts();
    }

    if (localStorage.getItem("aigon_member_ok") === "1") {
      unlock();
    }

    document.getElementById("enter-btn").addEventListener("click", () => {
      const val = document.getElementById("member-pass").value.trim();
      if (val === PASS) {
        localStorage.setItem("aigon_member_ok", "1");
        unlock();
      } else {
        document.getElementById("err-txt").style.display = "block";
      }
    });

    const defaultPrompts = [
      {
        title: "1. Googleマップ口コミ返信文（3パターン作成）",
        body: "あなたは地域で愛される店舗のベテラン店主です。以下のGoogleマップの口コミに対し、感謝と誠実さが伝わる返信文を3パターン（丁寧・親しみやすい・簡潔）作成してください。\n【業種】〇〇\n【口コミ】ここに貼り付け"
      },
      {
        title: "2. 店頭POP・LINEお知らせ文の作成",
        body: "小規模店舗の集客アドバイザーとして、以下の商品・サービスの「店頭POP用キャッチコピー」5案と「常連様向けLINE案内文」を作ってください。\n【商品・サービス名】〇〇\n【一番伝えたい強み】〇〇"
      }
    ];

    async function loadPrompts() {
      const grid = document.getElementById("dynamic-prompt-grid");
      let items = [...defaultPrompts];
      try {
        const q = query(collection(db, "prompts"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        snap.forEach(d => {
          items.unshift(d.data());
        });
      } catch (e) {
        console.error(e);
      }

      grid.innerHTML = "";
      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "prompt-card";

        const top = document.createElement("div");
        const h3 = document.createElement("h3");
        h3.textContent = item.title;
        const pre = document.createElement("div");
        pre.className = "prompt-body";
        pre.textContent = item.body;
        top.appendChild(h3);
        top.appendChild(pre);

        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "プロンプトをコピー";
        btn.onclick = () => {
          navigator.clipboard.writeText(item.body).then(() => {
            btn.textContent = "コピー完了！";
            btn.classList.add("done");
            setTimeout(() => {
              btn.textContent = "プロンプトをコピー";
              btn.classList.remove("done");
            }, 1800);
          });
        };

        card.appendChild(top);
        card.appendChild(btn);
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
