<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在庫の補充数チェック</title><style>body{background:#080b14;color:#eee;font:16px/1.7 system-ui;margin:0}main{max-width:540px;margin:32px auto;padding:24px;background:#101829;border:1px solid #b4974d;border-radius:16px}h1{font-size:1.35rem;color:#f0cf80}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid #b4974d}button{background:#e6c35f;color:#101010;cursor:pointer}output{display:block;margin-top:20px;white-space:pre-wrap}small{color:#c4cad6}a{color:#f0cf80}</style><main><h1>在庫の補充数チェック</h1><p>現在の在庫数と、そろえておきたい数から補充数を計算します。目標数以上なら0個と表示します。発注済みの数は考慮しません。入力内容の送信・保存はしません。</p><form><label>現在の在庫数<input name="current" type="number" min="0" step="any" value="0" required></label><label>そろえておきたい数<input name="goal" type="number" min="0" step="any" value="0" required></label><button>計算する</button></form><output aria-live="polite"></output><p><small>再読み込みすると入力内容は初期値に戻ります。</small></p><a href="member.html#tool-warehouse">会員ページへ戻る</a></main><script>const f=document.querySelector('form'),o=document.querySelector('output');const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';const show=s=>o.textContent=s;f.addEventListener('submit',e=>{e.preventDefault();try{const v={};for(const el of f.querySelectorAll('input')){if(!el.value.trim())throw Error('すべての欄を入力してください。');const n=Number(el.value);if(!Number.isFinite(n)||n<0)throw Error('0以上の数を入力してください。');v[el.name]=n;}if(!Number.isInteger(v.current)||!Number.isInteger(v.goal))throw Error('在庫数は整数で入力してください。');show('補充する数：'+Math.max(0,v.goal-v.current)+'個');}catch(err){show(err.message);}});</script></html>
