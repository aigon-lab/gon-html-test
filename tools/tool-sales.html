<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>売上と経費の差額メモ</title><style>body{background:#080b14;color:#eee;font:16px/1.7 system-ui;margin:0}main{max-width:540px;margin:32px auto;padding:24px;background:#101829;border:1px solid #b4974d;border-radius:16px}h1{font-size:1.35rem;color:#f0cf80}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid #b4974d}button{background:#e6c35f;color:#101010;cursor:pointer}output{display:block;margin-top:20px;white-space:pre-wrap}small{color:#c4cad6}a{color:#f0cf80}</style></head>
<body><main><h1>売上と経費の差額メモ</h1><p>売上と経費を入力すると、差額を計算します。日々の簡易確認用です。税金などは含みません。入力内容の送信・保存はしません。</p><form><label>売上（円）<input name="sales" type="number" min="0" step="any" value="0" required></label><label>経費（円）<input name="cost" type="number" min="0" step="any" value="0" required></label><button type="submit">計算する</button></form><output aria-live="polite"></output><p><small>再読み込みすると入力内容は初期値に戻ります。</small></p>
<a href="https://toretamoo.com/tenjiCorp/member.html#tool-warehouse">会員ページへ戻る</a>
<p><small>戻るリンク修正版：tools-return-r2</small></p></main><script>const f=document.querySelector('form'),o=document.querySelector('output');const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';const show=s=>o.textContent=s;f.addEventListener('submit',e=>{e.preventDefault();try{const v={};for(const el of f.querySelectorAll('input')){if(!el.value.trim())throw Error('すべての欄を入力してください。');const n=Number(el.value);if(!Number.isFinite(n)||n<0)throw Error('0以上の数を入力してください。');v[el.name]=n;}show('売上 − 経費：'+yen(v.sales-v.cost));}catch(err){show(err.message);}});</script></body></html>
